services:
  # Local dev (RUNTIME_ENVIRONMENT=DEV): the bot opens its own ngrok tunnel
  # (see utils/utils.py:start_ngrok), so no reverse proxy / domain is needed.
  # The upstream Caddy service is for production behind a real domain - it's
  # dropped here since it'd fail anyway without a generated Caddyfile.
  bot:
    build:
      context: .
    container_name: 'AiogramShopBot'
    env_file:
      - .env
    networks:
      - botnet
    ports:
      - "127.0.0.1:5000:5000" # ${WEBAPP_PORT}:${WEBAPP_PORT}
    volumes:
      - ./i18n:/bot/i18n
    command: [ "python", "-u", "run.py" ]
    restart: always
    extra_hosts:
      # host.docker.internal (used for PUBLISHING_API_URL) is automatic on
      # Docker Desktop but not on plain Linux Docker engines (e.g. the one
      # inside a GitHub Codespace) - this makes it resolve there too.
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:latest
    container_name: redis
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    ports:
      - "127.0.0.1:6379:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - botnet

  postgres:
    container_name: "postgres"
    image: "postgres:18"
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks:
      - botnet
    restart: always


volumes:
  redis_data:
  postgres_data:

networks:
  botnet: